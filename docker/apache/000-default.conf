<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite rules for Laravel
        <IfModule mod_rewrite.c>
            <IfModule mod_negotiation.c>
                Options -MultiViews
            </IfModule>

            RewriteEngine On

            # Redirect Trailing Slashes If Not A Folder...
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)/$ /$1 [L,R=301]

            # Handle Front Controller...
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # Allow access to static assets
    <Directory /var/www/html/public/css>
        <IfModule mod_rewrite.c>
            RewriteEngine Off
        </IfModule>
        Require all granted
    </Directory>

    <Directory /var/www/html/public/js>
        <IfModule mod_rewrite.c>
            RewriteEngine Off
        </IfModule>
        Require all granted
    </Directory>

    <Directory /var/www/html/public/images>
        <IfModule mod_rewrite.c>
            RewriteEngine Off
        </IfModule>
        Require all granted
    </Directory>

    <Directory /var/www/html/public/vendors>
        <IfModule mod_rewrite.c>
            RewriteEngine Off
        </IfModule>
        Require all granted
    </Directory>

    <Directory /var/www/html/public/uploads>
        <IfModule mod_rewrite.c>
            RewriteEngine Off
        </IfModule>
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
